<!doctype html>
<html lang="zh-CN" data-bg="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Coop</title>
  <link rel="stylesheet" href="/sidebar.css">
  <script src="/background.js" defer></script>
  <script src="/sidebar.js" defer></script>
</head>
<body>
  <div class="veil" aria-hidden="true"></div>
  <main>
    <header>
      <div class="title">
        <svg class="logo" viewBox="0 0 30 30" aria-hidden="true"><rect class="logo-bg" width="30" height="30" rx="9"/><path class="logo-arc" d="M9 19.5C10.5 10 19.5 10 21 19.5"/><circle class="logo-a" cx="9" cy="20" r="3"/><circle class="logo-b" cx="21" cy="20" r="3"/></svg>
        <div><h1>AI Coop</h1><span id="connection" class="conn" data-i18n="connecting">连接中</span></div>
      </div>
      <div class="actions">
        <button id="bgButton" class="icon-btn" type="button" aria-label="切换外观" aria-expanded="false" title="切换外观" data-i18n-title="background" data-i18n-aria="background">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5a7.5 7.5 0 1 0 0 15c1 0 1.6-.7 1.6-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5h1.8a3.4 3.4 0 0 0 3.4-3.4C17.5 5.5 14.1 2.5 10 2.5Z"/><circle cx="6.2" cy="9" r="1.1"/><circle cx="8.6" cy="5.9" r="1.1"/><circle cx="12.4" cy="5.9" r="1.1"/></svg>
        </button>
        <button id="enabled" class="switch" role="switch" aria-label="自动协作" aria-checked="false" disabled title="自动协作" data-i18n-aria="autoCollab" data-i18n-title="autoCollab"><span></span></button>
      </div>
    </header>
    <div id="bgMenu" class="glass bg-menu" role="group" aria-label="背景" data-i18n-aria="bgGroup" hidden></div>

    <div id="error" class="glass" role="alert" hidden></div>

    <section id="now" class="glass now idle">
      <div class="now-head"><span id="nowLabel" class="eyebrow" data-i18n="partner">协作伙伴</span><span id="nowState" class="pill" data-i18n="idle">空闲</span></div>
      <strong id="nowAgent" class="agent">—</strong>
      <div class="chips"><span id="nowModel" class="chip">—</span><span id="nowEffort" class="chip chip-accent">—</span></div>
      <div id="usage" class="usage" hidden></div>
      <p id="nowMeta" class="meta" data-i18n="idleMeta">在左侧聊天里描述任务，调用时这里会实时显示。</p>
      <div class="progress" aria-hidden="true"><span></span></div>
    </section>

    <section class="glass">
      <div class="row-head"><h2 data-i18n="next">下一次调用</h2><span id="saveStatus" class="save-status" role="status"></span></div>
      <div id="selMode" class="segmented" role="radiogroup" aria-label="模型选择方式" data-i18n-aria="selMode">
        <button type="button" data-sel="auto" role="radio" aria-checked="true" data-i18n="auto">自动</button>
        <button type="button" data-sel="manual" role="radio" aria-checked="false" data-i18n="manual">手动指定</button>
      </div>
      <p id="autoHint" class="hint" data-i18n="autoHint">主协调按任务类型挑选模型与推理强度。</p>
      <p id="loginHint" class="hint warn" hidden></p>
      <div id="manual" hidden>
        <label for="model" data-i18n="model">模型</label>
        <div class="select-wrap"><select id="model"></select></div>
        <input id="customModel" placeholder="输入完整模型 ID" data-i18n-ph="customPh" autocomplete="off" hidden>
        <label data-i18n="effort">推理强度</label>
        <div id="efforts" class="efforts" role="radiogroup" aria-label="推理强度" data-i18n-aria="effort"></div>
        <p id="modelHint" class="hint"></p>
      </div>
    </section>

    <section class="glass history">
      <div class="row-head"><h2 data-i18n="recent">最近调用</h2><span id="count" class="muted"></span></div>
      <ol id="runs"></ol>
    </section>

    <section id="detail" class="glass detail" hidden>
      <div class="detail-head">
        <button id="detailBack" class="back" type="button" aria-label="返回" data-i18n-aria="back"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
        <div class="detail-title"><strong id="detailAgent">—</strong><span id="detailMeta" class="muted"></span></div>
        <span id="detailState" class="pill"></span>
      </div>
      <details class="task"><summary data-i18n="task">任务</summary><p id="detailTask"></p></details>
      <ol id="transcript" class="transcript"></ol>
    </section>

    <footer><span id="workspacePath"></span><span id="access"></span></footer>
  </main>
</body>
</html>
