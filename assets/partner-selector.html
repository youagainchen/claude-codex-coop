<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Coop</title>
  <style>
    :root{color-scheme:light dark;--text:#242421;--muted:#777773;--hover:#0000000a;--field:#00000008;--line:#00000018;--ok:#24986a;--warn:#c48728;--bad:#cf5555}
    @media(prefers-color-scheme:dark){:root{--text:#e9e9e6;--muted:#9a9a95;--hover:#ffffff0b;--field:#ffffff09;--line:#ffffff17;--ok:#55bd89;--warn:#dfa44d;--bad:#e27474}}
    *{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text);font:13px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:1px}
    .bar{display:inline-flex;align-items:center;max-width:100%;height:32px;border-radius:9px;background:transparent}.bar.open{width:min(100%,470px);background:var(--hover)}
    button,input,select{font:inherit;color:inherit}.summary{height:32px;display:flex;align-items:center;gap:5px;min-width:0;border:0;border-radius:9px;padding:0 8px;background:transparent;cursor:pointer;white-space:nowrap}.summary:hover{background:var(--hover)}
    #summaryModel{max-width:260px;overflow:hidden;text-overflow:ellipsis;font-weight:600}#summaryEffort{color:var(--muted);font-weight:600}.caret{color:var(--muted);font-size:10px}.open .summary{display:none}
    .controls{display:none;align-items:center;gap:5px;width:100%;padding:2px 3px}.open .controls{display:flex}
    select,input{height:28px;min-width:0;border:1px solid transparent;border-radius:7px;background:var(--field);outline:none;padding:0 7px}select:focus,input:focus{border-color:var(--line)}select{width:68px}#model{flex:1;width:190px}#effort{width:78px}select:disabled,input:disabled{opacity:.45}
    .signal{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--warn);cursor:help}.signal.verified{background:var(--ok)}.signal.error{background:var(--bad)}
    .close{width:27px;height:27px;flex:0 0 auto;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}.close:hover{background:var(--hover);color:var(--text)}
    @media(max-width:390px){#model{width:135px}select{width:62px}#effort{width:70px}}
  </style>
</head>
<body>
  <section class="bar" id="bar" aria-label="协作 AI 模型选择">
    <button class="summary" id="toggle" type="button" aria-expanded="false"><span id="summaryModel">协作 AI</span><span id="summaryEffort"></span><span class="caret">⌄</span></button>
    <div class="controls">
      <span class="signal" id="signal" title="正在识别模型来源"></span>
      <select id="selection" aria-label="选择方式"><option value="auto">自动</option><option value="manual">手动</option></select>
      <input id="model" list="models" aria-label="协作 AI 模型" placeholder="输入模型 ID" autocomplete="off"><datalist id="models"></datalist>
      <select id="effort" aria-label="推理强度"></select>
      <button class="close" id="close" type="button" aria-label="收起">×</button>
    </div>
  </section>
  <script>
  (()=>{
    const el=id=>document.getElementById(id),bar=el('bar'),toggle=el('toggle'),selection=el('selection'),model=el('model'),models=el('models'),effort=el('effort'),signal=el('signal'),summaryModel=el('summaryModel'),summaryEffort=el('summaryEffort');
    const order=['none','minimal','low','medium','high','xhigh','max','ultra'],pending=new Map();let nextId=1,catalog=null,timer=null,open=!(window.openai?.widgetState?.privateContent?.collapsed??true);
    function height(){window.openai?.notifyIntrinsicHeight?.(document.documentElement.scrollHeight)}
    function setOpen(v,persist=true){open=!!v;bar.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));if(persist)expose();requestAnimationFrame(height)}
    function request(method,params){const id=nextId++;window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}))}
    async function call(name,args){return window.openai?.callTool?window.openai.callTool(name,args):request('tools/call',{name,arguments:args})}
    function structured(r){return r?.structuredContent??r?.mcp_tool_result?.structuredContent??r}
    function uniqueEfforts(values){return [...new Set((values||[]).filter(Boolean))].sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b)))}
    function entry(){return (catalog?.partner?.models||[]).find(x=>x.id===model.value)}
    function fillEffort(preferred){const item=entry(),values=uniqueEfforts(item?.efforts?.length?item.efforts:catalog?.partner_efforts);effort.replaceChildren(...values.map(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;return o}));const fallback=item?.default_effort||catalog?.preferences?.effort||'medium';effort.value=values.includes(preferred)?preferred:(values.includes(fallback)?fallback:values[0]||'medium')}
    function disabled(){const auto=selection.value==='auto';model.disabled=auto;effort.disabled=auto}
    function summary(){const partner=catalog?.partner_agent==='claude'?'Claude':catalog?.partner_agent==='codex'?'Codex':'协作 AI';if(selection.value==='auto'){summaryModel.textContent=partner+' · 自动';summaryEffort.textContent=''}else{summaryModel.textContent=entry()?.label?.replace(/ · (已运行验证|别名)$/,'')||model.value||partner;summaryEffort.textContent=effort.value}}
    function expose(){window.openai?.setWidgetState?.({modelContent:`协作 AI：${catalog?.partner_agent||'unknown'}；${selection.value}；模型 ${model.value}；推理强度 ${effort.value}`,privateContent:{partner:catalog?.partner_agent,selection:selection.value,model:model.value,effort:effort.value,collapsed:!open}})}
    function render(data){if(!data?.partner)return;catalog=data;models.replaceChildren(...(data.partner.models||[]).map(x=>{const o=document.createElement('option');o.value=x.id;o.label=x.label||x.id;return o}));const pref=data.preferences||{};selection.value=pref.selection||'auto';model.value=pref.model||(data.partner.models||[])[0]?.id||'';fillEffort(pref.effort);disabled();summary();signal.className='signal '+(data.partner.verified?'verified':'');signal.title=data.partner.note||data.partner.source||'模型来源未知';setOpen(open,false);height()}
    async function save(){if(!catalog||!model.value||!effort.value)return;signal.classList.remove('error');try{const r=structured(await call('set_partner_preferences',{primary_agent:catalog.primary_agent,partner_selection:selection.value,partner_model:model.value,partner_effort:effort.value}));if(r?.saved===false)throw Error('未保存');summary();expose()}catch(e){signal.classList.add('error');signal.title='保存失败：'+(e?.message||e)}}
    function queue(){clearTimeout(timer);timer=setTimeout(save,150)}
    toggle.onclick=()=>setOpen(true);el('close').onclick=()=>setOpen(false);selection.onchange=()=>{disabled();summary();queue()};model.onchange=()=>{fillEffort(effort.value);summary();queue()};model.onblur=()=>{summary();queue()};effort.onchange=()=>{summary();queue()};
    window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent)},{passive:true});
    if(window.openai?.toolOutput)render(window.openai.toolOutput);setTimeout(async()=>{if(catalog)return;try{render(structured(await call('get_model_catalog',{})))}catch(e){signal.classList.add('error');signal.title='连接失败'}},250);setOpen(open,false);
  })();
  </script>
</body>
</html>
